[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reframe-studio"
version = "0.2.0"
description = "Native Python video reframing editor with keyframed FFmpeg export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.9,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4"]

[project.scripts]
reframe-studio = "main:main"

[tool.setuptools]
py-modules = ["main", "reframe_app", "reframe_core"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: tests requiring external FFmpeg binaries",
]
